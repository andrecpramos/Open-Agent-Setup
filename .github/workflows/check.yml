# The kit's gate on every pull request and every push to main: build, lint, strict typecheck and
# every test (npm run check), then the committed eval scorecards against their
# baselines (evals --check fails on a regression beyond sampling noise).
#
# The agent evals themselves (eval-routing) need a signed-in agent and are run
# before a release; their scorecards are committed, and this job keeps them honest.
name: check

# Every change reaches main through a pull request (main is protected), so a branch is checked
# once, as a pull request, and main once more after the merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node bin/agent-setup.mjs evals --check
